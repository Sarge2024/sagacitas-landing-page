<meta name="color-scheme" content="light dark">
<!--theme-init-->
<script>(function(){var t=null;try{t=localStorage.getItem("wm-theme");}catch(e){}if(!t){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";}document.documentElement.setAttribute("data-theme",t);})();</script>
<!--/theme-init-->
